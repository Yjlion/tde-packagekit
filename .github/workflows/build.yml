name: Build Debian package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the package for Debian 13 and Trinity 14.1
        run: sudo .github/build-deb.sh

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: tdepackagekit-${{ github.sha }}
          path: dist/*.deb
          if-no-files-found: error
