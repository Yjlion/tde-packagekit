name: Build Debian package

# Every push and pull request builds the package, kept as a workflow artifact.
#
# A version tag (v1.2.3) also makes a release. The tag is created when you publish a
# release on GitHub, or when you push it with git. The package is built with the tag's
# version and attached to the tag's release; if the tag has no release yet, a draft
# release is created with the package, for you to edit and publish.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  deb:
    name: Debian ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [ bookworm, trixie ]
    steps:
      - uses: actions/checkout@v7

      - name: Build the package for Debian ${{ matrix.suite }} and Trinity 14.1
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          SUITE: ${{ matrix.suite }}
        run: sudo env DEB_VERSION="$TAG" SUITE="$SUITE" .github/build-deb.sh

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: tdepackagekit-${{ matrix.suite }}-${{ github.sha }}
          path: dist/*.deb
          if-no-files-found: error

  # A separate job, so that only this step can write to the repository.
  release:
    if: github.ref_type == 'tag'
    needs: deb
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tdepackagekit-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.deb --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.deb --draft --verify-tag --generate-notes \
              --title "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
